name: smg-collector

services:
  volume-init:
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /srv/cdr /data/spool && chown -R 1000:1000 /srv/cdr /data/spool"]
    volumes:
      - cdr_data:/srv/cdr
      - spool_data:/data/spool
    restart: "no"

  collector-ingress:
    image: ghcr.io/finenumbers/collector:latest
    pull_policy: always
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      COLLECTOR_ROLE: ingress
      ENVIRONMENT: production
      SYSLOG_ADDR: ":${SYSLOG_PORT:-514}"
      INGRESS_SPOOL_PATH: /data/spool/ingress.db
      HANDOFF_SOCKET_PATH: /data/spool/handoff.sock
      INGRESS_STATUS_PATH: /data/spool/ingress-status.json
      INGRESS_HEALTH_ADDR: 127.0.0.1:18081
      TZ: ${TZ:-UTC}
    volumes:
      - spool_data:/data/spool
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:18081"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: collector
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.6-alpine
    environment:
      CLICKHOUSE_DB: collector
      CLICKHOUSE_USER: collector
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "collector", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: collector
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  sftpgo:
    image: drakkan/sftpgo:v2.6-alpine
    user: "1000:1000"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      SFTPGO_DEFAULT_ADMIN_USERNAME: collector
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:?SFTPGO_ADMIN_PASSWORD is required}
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
      SFTPGO_FTPD__BINDINGS__0__PORT: "2121"
      SFTPGO_FTPD__PASSIVE_PORT_RANGE__START: "50000"
      SFTPGO_FTPD__PASSIVE_PORT_RANGE__END: "50100"
      SFTPGO_FTPD__BINDINGS__0__FORCE_PASSIVE_IP: ${PUBLIC_HOST:-}
    ports:
      - "${FTP_PORT:-21}:2121"
      - "50000-50100:50000-50100"
    volumes:
      - sftpgo_data:/var/lib/sftpgo
      - cdr_data:/srv/cdr
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  collector:
    image: ghcr.io/finenumbers/collector:latest
    pull_policy: always
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      nats: { condition: service_healthy }
      minio: { condition: service_healthy }
      sftpgo: { condition: service_healthy }
      collector-ingress: { condition: service_healthy }
    environment:
      COLLECTOR_ROLE: app
      ENVIRONMENT: production
      HTTP_ADDR: ":8080"
      SYSLOG_SPOOL_PATH: /data/spool/syslog.db
      HANDOFF_SOCKET_PATH: /data/spool/handoff.sock
      INGRESS_STATUS_PATH: /data/spool/ingress-status.json
      DATABASE_URL: postgres://collector:${POSTGRES_PASSWORD}@postgres:5432/collector?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: collector
      CLICKHOUSE_USER: collector
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: collector
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SFTPGO_URL: http://sftpgo:8080
      SFTPGO_ADMIN: collector
      SFTPGO_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      CUSTOM_PROJECTION_ENABLED: ${CUSTOM_PROJECTION_ENABLED:-true}
      CUSTOM_PROJECTION_BATCH_SIZE: ${CUSTOM_PROJECTION_BATCH_SIZE:-128}
      CUSTOM_PROJECTION_MAX_EVENTS: ${CUSTOM_PROJECTION_MAX_EVENTS:-20000}
      CUSTOM_PROJECTION_THREADS: ${CUSTOM_PROJECTION_THREADS:-1}
      CUSTOM_PROJECTION_MAX_MEMORY_BYTES: ${CUSTOM_PROJECTION_MAX_MEMORY_BYTES:-134217728}
      CUSTOM_PROJECTION_SLEEP: ${CUSTOM_PROJECTION_SLEEP:-1s}
      CUSTOM_PAIRING_HORIZON: ${CUSTOM_PAIRING_HORIZON:-5m}
      CUSTOM_RETRY_HORIZON: ${CUSTOM_RETRY_HORIZON:-168h}
      CLICKHOUSE_ADMISSION_CAPACITY: ${CLICKHOUSE_ADMISSION_CAPACITY:-8}
      EXPORT_PAGE_SIZE: ${EXPORT_PAGE_SIZE:-1000}
      CDR_COVERAGE_EXPECTED_GRACE: ${CDR_COVERAGE_EXPECTED_GRACE:-5m}
      CDR_COVERAGE_LATE_THRESHOLD: ${CDR_COVERAGE_LATE_THRESHOLD:-5m}
      CDR_COVERAGE_MISSING_TERMINAL: ${CDR_COVERAGE_MISSING_TERMINAL:-30m}
      CDR_COVERAGE_RETRY_HORIZON: ${CDR_COVERAGE_RETRY_HORIZON:-168h}
      VOIPMONITOR_ENABLED: ${VOIPMONITOR_ENABLED:-false}
      VOIPMONITOR_API_URL: ${VOIPMONITOR_API_URL:-}
      VOIPMONITOR_USER: ${VOIPMONITOR_USER:-}
      VOIPMONITOR_PASSWORD: ${VOIPMONITOR_PASSWORD:-}
      VOIPMONITOR_GUI_URL: ${VOIPMONITOR_GUI_URL:-}
      VOIPMONITOR_CARD_URL_TEMPLATE: ${VOIPMONITOR_CARD_URL_TEMPLATE:-}
      VOIPMONITOR_TIME_SKEW: ${VOIPMONITOR_TIME_SKEW:-5s}
      VOIPMONITOR_WORKER_SLEEP: ${VOIPMONITOR_WORKER_SLEEP:-5s}
      VOIPMONITOR_LEASE: ${VOIPMONITOR_LEASE:-2m}
      VOIPMONITOR_MIN_SCORE: ${VOIPMONITOR_MIN_SCORE:-60}
      VOIPMONITOR_RATE_LIMIT_PER_SEC: ${VOIPMONITOR_RATE_LIMIT_PER_SEC:-5}
      TZ: ${TZ:-UTC}
    volumes:
      - cdr_data:/data/cdr
      - spool_data:/data/spool
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      default:
      proxy:
        aliases:
          - smg-collector
    deploy:
      resources:
        limits:
          cpus: "${COLLECTOR_CPUS:-4}"
          memory: ${COLLECTOR_MEMORY:-4G}
    restart: unless-stopped

  # Split-role deployment: start with
  # docker compose --profile split up --scale collector=0
  # so the all-in-one service cannot duplicate listeners or workers.
  collector-api-ingest:
    extends:
      service: collector
    profiles: ["split"]
    environment:
      COLLECTOR_ROLE: api-ingest
      CLICKHOUSE_USER: ${CLICKHOUSE_API_USER:-collector}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-${CLICKHOUSE_PASSWORD}}
    deploy:
      resources:
        limits:
          cpus: "${COLLECTOR_API_CPUS:-2}"
          memory: ${COLLECTOR_API_MEMORY:-2G}

  collector-export:
    extends:
      service: collector
    profiles: ["split"]
    depends_on:
      collector-api-ingest: { condition: service_healthy }
    environment:
      COLLECTOR_ROLE: export
      CLICKHOUSE_USER: ${CLICKHOUSE_EXPORT_USER:-collector}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_EXPORT_PASSWORD:-${CLICKHOUSE_PASSWORD}}
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "${COLLECTOR_EXPORT_CPUS:-2}"
          memory: ${COLLECTOR_EXPORT_MEMORY:-2G}

  collector-maintenance:
    extends:
      service: collector
    profiles: ["split"]
    depends_on:
      collector-api-ingest: { condition: service_healthy }
    environment:
      COLLECTOR_ROLE: maintenance
      CLICKHOUSE_USER: ${CLICKHOUSE_MAINTENANCE_USER:-collector}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MAINTENANCE_PASSWORD:-${CLICKHOUSE_PASSWORD}}
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "${COLLECTOR_MAINTENANCE_CPUS:-2}"
          memory: ${COLLECTOR_MAINTENANCE_MEMORY:-2G}

volumes:
  postgres_data:
  clickhouse_data:
  nats_data:
  minio_data:
  sftpgo_data:
  cdr_data:
  spool_data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
